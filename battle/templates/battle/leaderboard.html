<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        body{
            background-color: #1a1a2e;
            text-align: center;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            gap: 30px;
        }
        h1{
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
        }
        table{
            border-collapse: collapse;
            width: 50%;
        }
        th,td{
            padding: 15px;
            border-bottom: 1px solid #333;
            font-size: 18px;
        }
        th{
            color: #ffd700;
        }
        a{
            text-decoration: none;
        }
        button{
            background-color: red;
            border-radius: 10px;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🏆 Leaderboard</h1>
    <table>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Score</th>
        </tr>
        {% for score in scores %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ score.name }}</td>
            <td>{{ score.score }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/">
        <button>🏠 Home</button>
    </a>
</body>
</html>
